<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台電換表助手 V43</title>
  <link rel="stylesheet" href="style.css?v=43.0">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
<header>
  <h1>台電換表助手</h1>
  <div id="status">未登入</div>
</header>

<main>
  <section id="loginCard" class="card">
    <h2>工程師登入</h2>
    <input id="username" placeholder="帳號，例如 A001" autocomplete="username">
    <button id="loginBtn">登入</button>
    <p class="hint">V43：縮小掃描框並提供大按鈕倍率，改善小型 QR 辨識。</p>
  </section>

  <section id="scanCard" class="card hidden">
    <div class="top">
      <div>
        <b id="engineerName"></b><br>
        今日已掃：<b id="todayCount">0</b> 筆
      </div>
      <button id="logoutBtn" class="gray small">登出</button>
    </div>

    <h2>掃新電表 QR Code</h2>
    <div id="reader"></div>
    <div id="cameraControls" class="camera-controls hidden">
      <div id="zoomControl" class="zoom-control hidden">
        <div class="camera-control-title">畫面倍率</div>
        <div class="zoom-buttons">
          <button type="button" class="zoom-btn hidden" data-zoom="1">1 倍</button>
          <button type="button" class="zoom-btn hidden" data-zoom="2">2 倍</button>
          <button type="button" class="zoom-btn hidden" data-zoom="3">3 倍</button>
        </div>
      </div>
      <button id="torchBtn" type="button" class="torch-btn hidden">開啟手電筒</button>
      <p class="camera-control-note">預設使用 2 倍；小貼紙掃不到時可試 3 倍。手機不支援的功能不會顯示。</p>
    </div>
    <button id="startBtn">啟用相機掃描</button>
    <button id="stopBtn" class="gray">停止掃描</button>
    <div id="result" class="result">等待掃描...</div>
    <div id="queueStatus" class="queue-status complete">待上傳 0 筆・全部完成</div>
    <div id="androidBrowserBox" class="browser-help hidden">
      <div id="androidBrowserText" class="browser-help-text">安卓 LINE 可能無法開啟相機，請改用 Chrome。</div>
      <button id="openChromeBtn" type="button" class="chrome-btn">使用 Chrome 開啟</button>
      <p class="browser-help-note">若按鈕沒有反應，請點 LINE 畫面右下角「⋮」，再選「使用其他應用程式開啟」。</p>
    </div>
    <div id="unlockDuplicateBox" class="unlock-box hidden">
      <button id="unlockDuplicateBtn" type="button" class="unlock-btn">解除此電表鎖定</button>
      <p class="unlock-note">請先把「電表編碼」改正，再按此按鈕。只解除目前這一顆，其他掃描紀錄不會被清除。</p>
    </div>
    <p class="hint">小型 QR 建議保持約 8～15 公分，讓貼紙完整對準白框；可切換 1、2、3 倍測試。</p>
  </section>
</main>

  <script src="app.js?v=43.1"></script>
</body>
</html>
