<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台電換表助手 V40</title>
  <link rel="stylesheet" href="style.css?v=40.0">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
<header>
  <h1>台電換表助手</h1>
  <div id="status">未登入</div>
</header>

<main>
  <section id="loginCard" class="card">
    <h2>工程師登入</h2>
    <input id="username" placeholder="帳號，例如 A001" autocomplete="username">
    <button id="loginBtn">登入</button>
    <p class="hint">V40：掃碼先存手機並在背景依序上傳，可立即掃下一顆。</p>
  </section>

  <section id="scanCard" class="card hidden">
    <div class="top">
      <div>
        <b id="engineerName"></b><br>
        今日已掃：<b id="todayCount">0</b> 筆
      </div>
      <button id="logoutBtn" class="gray small">登出</button>
    </div>

    <h2>掃新電表 QR Code</h2>
    <div id="reader"></div>
    <button id="startBtn">啟用相機掃描</button>
    <button id="stopBtn" class="gray">停止掃描</button>
    <div id="result" class="result">等待掃描...</div>
    <div id="queueStatus" class="queue-status complete">待上傳 0 筆・全部完成</div>
    <div id="unlockDuplicateBox" class="unlock-box hidden">
      <button id="unlockDuplicateBtn" type="button" class="unlock-btn">解除此電表鎖定</button>
      <p class="unlock-note">請先把「電表編碼」改正，再按此按鈕。只解除目前這一顆，其他掃描紀錄不會被清除。</p>
    </div>
    <p class="hint">請保持約 15～25 公分距離，讓 QR Code 完整放入框內；不必貼近鏡頭。</p>
  </section>
</main>

  <script src="app.js?v=40.0"></script>
</body>
</html>
